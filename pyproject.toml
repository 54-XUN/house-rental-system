[project]
name = "house-rental-system"
version = "1.0.0"
description = "房屋出租管理系统：Flask + Vue3 单机桌面应用"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12.10"
dependencies = [
    "flask>=3.1.3",
    "flask-cors>=6.0.2",
    "flask-sqlalchemy>=3.1.1",
    "pywebview>=6.2.1",
    "pywin32>=311",
    "screeninfo>=0.8.1",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pyinstaller>=6.20.0",
    "pytest>=9.0.3",
    "pytest-flask>=1.3.0",
    "ruff>=0.15.14",
]

[tool.ruff.lint.per-file-ignores]
# app.py 顶部的 sys.path 处理是 PyInstaller 打包兼容所需，导入顺序告警属误报
"backend/app.py" = ["E402"]

[tool.pytest.ini_options]
# 禁用缓存插件：不在项目根生成 .pytest_cache 文件夹
addopts = "-p no:cacheprovider"
